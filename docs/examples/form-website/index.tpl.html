@template "Form website" description="A configurable form posting to a PHP success page." version=1
@section index "Main page"
@param title String = "Request a callback" label="Page title"
@endsection
@previewData
{}
@endpreviewData
@layout
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/assets/site.css"></head>
<body><main>
<h1>{{title}}</h1>
<form method="post" action="/success.php?source=landing">
<label>Your name <input name="name" required maxlength="120" autocomplete="name"></label>
<label>Email <input name="email" type="email" required maxlength="254" autocomplete="email"></label>
<button type="submit">Send request</button>
</form>
</main></body></html>
@endlayout
