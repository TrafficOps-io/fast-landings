[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = landingphp
group = landingreaders
listen = 0.0.0.0:9000
listen.backlog = 128
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 35s
ping.path = /fpm-ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
security.limit_extensions = .php
