[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = fastlandings
group = fastlandings
listen = 0.0.0.0:9000
listen.backlog = 256
pm = dynamic
pm.max_children = 3
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 3
pm.max_requests = 500
ping.path = /fpm-ping
ping.response = pong
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
