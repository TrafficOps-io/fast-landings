expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 16M
upload_max_filesize = 10M
upload_tmp_dir = /tmp/uploads
max_file_uploads = 10
allow_url_include = Off
user_ini.filename =
ffi.enable = false
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
cgi.fix_pathinfo = 0
auto_prepend_file = /opt/fast-landings/runtime-bootstrap.php
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
zend.assertions = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
# Both gateways pass the real immutable release directory. Revalidation also
# keeps editable local releases correct without restarting the runtime.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = off
