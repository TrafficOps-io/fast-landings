worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 110m;

    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    upstream fast_landings_php {
        server app:9000;
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location = /internal/caddy/ask {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 443;
            fastcgi_pass fast_landings_php;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php(?:$|/) {
            return 404;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }
    }

    # Caddy is the only client on this listener. No other application route is
    # reachable here, so certificate authorization cannot become a public API.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /internal/caddy/ask {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/fast-landings/caddy-ask.php;
            fastcgi_param SCRIPT_NAME /internal/caddy/ask;
            # Preserve QUERY_STRING for authentication, but redact it from the
            # request URI observed by PHP-FPM's access logger.
            fastcgi_param REQUEST_URI /internal/caddy/ask;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass fast_landings_php;
            fastcgi_read_timeout 5s;
        }

        location / {
            return 404;
        }
    }
}
