name: fast-landings-local

services:
  landing-php:
    image: ${LANDING_PHP_IMAGE:-fast-landings-landing-php:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: landing-php
    restart: unless-stopped
    init: true
    # Local releases retain their owner's private filesystem permissions.
    user: "${FAST_LANDINGS_PHP_UID:-1000}:${FAST_LANDINGS_PHP_GID:-1000}"
    ports:
      - "127.0.0.1:${FAST_LANDINGS_PHP_PORT:-9070}:9000"
    volumes:
      - ${LANDINGS_PATH:-./storage/app/landings}:/srv/landings:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=${FAST_LANDINGS_PHP_UID:-1000},gid=${FAST_LANDINGS_PHP_GID:-1000},mode=0700
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 640m
    security_opt:
      - no-new-privileges:true
    networks:
      - landing_runtime
    healthcheck:
      test: ["CMD", "landing-php-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fast_landings}
      POSTGRES_USER: ${DB_USERNAME:-fast_landings}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-54331}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  landing_runtime:
